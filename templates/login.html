{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<form method="POST" action="{{ url_for('login') }}">
    <label for="email">Email:</label>
    <input type="text" id="email" name="email" required placeholder="Student email or teacher username">

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Login</button>
</form>

<p>New student? <a href="{{ url_for('register') }}">Register here</a></p>
<p>New teacher? <a href="{{ url_for('teacher_register') }}">Register here</a></p>
{% endblock %}
