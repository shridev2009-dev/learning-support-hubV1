{% extends "base.html" %}
{% block content %}
    <h2>Login</h2>
    <form method="POST">
        <label>I am a:</label>
        <select name="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
{% endblock %}
