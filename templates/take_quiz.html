{% extends "base.html" %}
{% block title %}Take Quiz{% endblock %}

{% block content %}
<h2>Quiz</h2>

{% if questions %}
<form method="POST" action="{{ url_for('take_quiz', material_id=material_id) }}">
    {% for q in questions %}
    <div class="quiz-question">
        <p><strong>{{ loop.index }}. {{ q.question }}</strong></p>
        <label><input type="radio" name="q{{ q.quiz_id }}" value="A" required> A) {{ q.option_a }}</label><br>
        <label><input type="radio" name="q{{ q.quiz_id }}" value="B"> B) {{ q.option_b }}</label><br>
        <label><input type="radio" name="q{{ q.quiz_id }}" value="C"> C) {{ q.option_c }}</label><br>
        <label><input type="radio" name="q{{ q.quiz_id }}" value="D"> D) {{ q.option_d }}</label>
    </div>
    {% endfor %}
    <button type="submit">Submit Quiz</button>
</form>
{% else %}
    <p>No quiz questions available for this module yet.</p>
{% endif %}
{% endblock %}
