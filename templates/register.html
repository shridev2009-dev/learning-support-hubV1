{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<h2>Student Registration</h2>
<form method="POST" action="{{ url_for('register') }}">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="class">Class:</label>
    <input type="text" id="class" name="class" placeholder="e.g. 12th A" required>

    <button type="submit">Register</button>
</form>

<p>Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
<p>Are you a teacher? <a href="{{ url_for('teacher_register') }}">Register as a teacher</a></p>
{% endblock %}
